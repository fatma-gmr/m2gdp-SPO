name = "binofit-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Variables non sensibles (identifiant du projet Firebase pour vérifier les jetons,
# URL du projet Supabase). La clé SUPABASE_SECRET_KEY, elle, est un secret Wrangler
# (voir .dev.vars.example) — jamais ici, jamais dans le code.
[vars]
FIREBASE_PROJECT_ID = "binofit-a36cf"
SUPABASE_URL = "https://mnieghijbueopaiebnyp.supabase.co"
ENVIRONMENT = "development"

# Relais temps réel : une Durable Object par utilisateur (connexions WebSocket).
[[durable_objects.bindings]]
name = "USER_HUB"
class_name = "UserHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserHub"]
