# Fichier généré depuis specs/openapi.json par workers/scripts/openapi-to-yaml.mjs.
# Ne pas modifier à la main : modifier openapi.json puis relancer le script.
openapi: "3.0.3"
info:
  title: "BINOFIT API"
  description: "API Cloudflare Workers de BINOFIT, application de matching sportif. Authentification via jeton Firebase Auth (lien magique)."
  version: "0.1.0"
servers:
  - url: "https://binofit-api.siamak036.workers.dev"
    description: Production
  - url: "http://localhost:8787"
    description: "Développement local (wrangler dev)"
security:
  - bearerAuth: []
tags:
  - name: users
    description: "Profils sportifs et recherche de partenaires"
  - name: activities
    description: "Propositions ponctuelles d'un utilisateur à un autre"
  - name: conversations
    description: "Conversations entre utilisateurs"
  - name: messages
    description: "Messages échangés dans une conversation"
  - name: favorites
    description: "Utilisateurs et activités mis en favori"
paths:
  "/users":
    get:
      tags:
        - users
      summary: "Rechercher des utilisateurs à proximité"
      description: "Retourne les profils publics des utilisateurs correspondant aux critères de géolocalisation et de pratique sportive. `lat`, `lng` et `maxKm` doivent être fournis ensemble pour activer le filtre géographique."
      parameters:
        - name: lat
          in: query
          description: "Latitude du point de recherche"
          schema:
            type: number
            format: double
        - name: lng
          in: query
          description: "Longitude du point de recherche"
          schema:
            type: number
            format: double
        - name: maxKm
          in: query
          description: "Rayon de recherche en kilomètres autour de (lat, lng)"
          schema:
            type: number
            format: double
            minimum: 0
        - name: sport
          in: query
          description: "Filtrer sur une discipline pratiquée"
          schema:
            "$ref": "#/components/schemas/Sport"
        - name: level
          in: query
          description: "Filtrer sur le niveau de pratique pour le sport donné"
          schema:
            "$ref": "#/components/schemas/Level"
        - name: availability
          in: query
          description: "Filtrer sur un jour de disponibilité"
          schema:
            "$ref": "#/components/schemas/DayOfWeek"
      responses:
        "200":
          description: "Liste des profils correspondant aux critères. Chaque profil porte `distanceKm` si (et seulement si) lat/lng/maxKm ont été fournis."
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/UserSearchResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/users/{id}":
    get:
      tags:
        - users
      summary: "Récupérer un profil utilisateur"
      parameters:
        - "$ref": "#/components/parameters/UserId"
      responses:
        "200":
          description: "Profil utilisateur"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
    put:
      tags:
        - users
      summary: "Créer ou mettre à jour son profil utilisateur"
      description: "Crée ou met à jour le profil de l'utilisateur connecté. `id` doit être égal à l'uid du jeton d'authentification : il est impossible de créer ou de modifier le profil d'un autre utilisateur (403).\n\n- **Profil inexistant (création, 201)** : `firstName`, `lastName` et `location` sont obligatoires ; `sports` et `availability` valent `[]` et `bio`/`avatarUrl` `null` s'ils sont omis. `createdAt` et `updatedAt` sont fixés à la date de la requête.\n- **Profil existant (mise à jour, 200)** : seuls les champs fournis sont modifiés ; `updatedAt` est rafraîchi, `createdAt` est inchangé.\n\nL'e-mail n'est jamais lu dans le corps : il est toujours pris dans le jeton (claim `email`). Une création avec un jeton sans e-mail est refusée (400, `missing_email`)."
      parameters:
        - "$ref": "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserUpdate"
            examples:
              creation:
                summary: "Création du profil (premier appel après inscription)"
                value:
                  firstName: "Léa"
                  lastName: Martin
                  sports:
                    - sport: course_a_pied
                      level: intermediaire
                    - sport: yoga
                      level: debutant
                  location:
                    city: Lyon
                    lat: 45.764
                    lng: 4.8357
                  availability:
                    - dayOfWeek: mardi
                      startTime: "18:00"
                      endTime: "20:00"
                    - dayOfWeek: samedi
                      startTime: "09:00"
                      endTime: "11:00"
                  bio: "Je prépare un semi-marathon, partante pour des sorties le soir."
              miseAJour:
                summary: "Mise à jour partielle d'un profil existant"
                value:
                  bio: "Semi-marathon bouclé ! Je cherche maintenant des partenaires de trail."
                  location:
                    city: Villeurbanne
                    lat: 45.7719
                    lng: 4.8902
      responses:
        "200":
          description: "Profil existant mis à jour"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                id: Xk3p9QmZr2TfW8aLc1VbN7yHd4E2
                email: "lea.martin@example.com"
                firstName: "Léa"
                lastName: Martin
                avatarUrl: null
                bio: "Semi-marathon bouclé ! Je cherche maintenant des partenaires de trail."
                location:
                  city: Villeurbanne
                  lat: 45.7719
                  lng: 4.8902
                sports:
                  - sport: course_a_pied
                    level: intermediaire
                  - sport: yoga
                    level: debutant
                availability:
                  - dayOfWeek: mardi
                    startTime: "18:00"
                    endTime: "20:00"
                  - dayOfWeek: samedi
                    startTime: "09:00"
                    endTime: "11:00"
                createdAt: "2026-10-11T08:30:00.000Z"
                updatedAt: "2026-10-12T19:05:00.000Z"
        "201":
          description: "Profil créé (le document users/{id} n'existait pas)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                id: Xk3p9QmZr2TfW8aLc1VbN7yHd4E2
                email: "lea.martin@example.com"
                firstName: "Léa"
                lastName: Martin
                avatarUrl: null
                bio: "Je prépare un semi-marathon, partante pour des sorties le soir."
                location:
                  city: Lyon
                  lat: 45.764
                  lng: 4.8357
                sports:
                  - sport: course_a_pied
                    level: intermediaire
                  - sport: yoga
                    level: debutant
                availability:
                  - dayOfWeek: mardi
                    startTime: "18:00"
                    endTime: "20:00"
                  - dayOfWeek: samedi
                    startTime: "09:00"
                    endTime: "11:00"
                createdAt: "2026-10-11T08:30:00.000Z"
                updatedAt: "2026-10-11T08:30:00.000Z"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/activities":
    post:
      tags:
        - activities
      summary: "Proposer une activité à un autre utilisateur"
      description: "Crée une proposition ponctuelle de `createdBy` (déduit du jeton d'authentification) vers `guestId`. `guestId` doit être différent de `createdBy`. Le statut initial est toujours `en_attente`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ActivityCreate"
      responses:
        "201":
          description: "Activité créée"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Activity"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/ProfileRequired"
        "404":
          "$ref": "#/components/responses/NotFound"
    get:
      tags:
        - activities
      summary: "Lister les activités"
      description: "Retourne les propositions où `userId` est créateur (`createdBy`) ou invité (`guestId`), de la plus récente à la plus ancienne. `userId` vaut par défaut l'utilisateur authentifié et ne peut pas désigner un autre utilisateur (403)."
      parameters:
        - name: userId
          in: query
          description: "Filtrer les activités liées à cet utilisateur (créateur ou invité) ; doit être l'utilisateur authentifié"
          schema:
            type: string
      responses:
        "200":
          description: "Liste des activités"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Activity"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/activities/{id}/status":
    patch:
      tags:
        - activities
      summary: "Répondre à une proposition ou la clôturer"
      description: "Transitions attendues : l'invité (`guestId`) fait passer `en_attente` → `acceptee` ou `en_attente` → `refusee` ; le créateur ou l'invité fait passer `acceptee` → `terminee` une fois la session passée. Toute autre transition, ou tout autre utilisateur, reçoit 403."
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant de l'activité"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ActivityStatusUpdate"
      responses:
        "200":
          description: "Activité mise à jour"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Activity"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/conversations":
    get:
      tags:
        - conversations
      summary: "Lister les conversations de l'utilisateur authentifié"
      description: "Retourne les conversations auxquelles l'utilisateur courant (déduit du jeton d'authentification) participe, triées par `updatedAt` décroissant."
      responses:
        "200":
          description: "Liste des conversations"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Conversation"
        "401":
          "$ref": "#/components/responses/Unauthorized"
    post:
      tags:
        - conversations
      summary: "Ouvrir une conversation avec un autre utilisateur"
      description: "Crée une conversation 1-à-1 entre l'utilisateur authentifié et `participantId`, éventuellement liée à une activité dont ils sont le créateur et l'invité (l'activité reçoit alors `conversationId`). Si une conversation existe déjà pour cette paire et cette activité, elle est renvoyée avec le statut 200."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ConversationCreate"
      responses:
        "200":
          description: "Conversation déjà existante"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Conversation"
        "201":
          description: "Conversation créée"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Conversation"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          description: "Profil manquant (`code`: `profile_required`) : l'utilisateur du jeton n'a pas encore de profil dans `users` (à créer via PUT /users/{id}) ; vérifié avant toute autre validation. Ou activité ne concernant pas ces deux utilisateurs (`code`: `forbidden`)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                profile_required:
                  value:
                    error: "Complète ton profil pour continuer"
                    code: profile_required
                forbidden:
                  value:
                    error: "Cette activité ne concerne pas ces deux utilisateurs"
                    code: forbidden
        "404":
          "$ref": "#/components/responses/NotFound"
  "/conversations/{id}/messages":
    get:
      tags:
        - messages
      summary: "Lister les messages d'une conversation"
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant de la conversation"
          schema:
            type: string
        - name: limit
          in: query
          description: "Nombre maximum de messages à retourner"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          description: "Horodatage ISO 8601 pour paginer les messages plus anciens que cette date"
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: "Liste des messages, triés par `sentAt` croissant"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Message"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/messages":
    post:
      tags:
        - messages
      summary: "Envoyer un message"
      description: "Crée un message dans une conversation existante. L'auteur (`senderId`) est déduit du jeton d'authentification."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MessageCreate"
      responses:
        "201":
          description: "Message créé"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/favorites":
    get:
      tags:
        - favorites
      summary: "Lister les favoris de l'utilisateur authentifié"
      description: "Retourne les favoris de l'utilisateur courant (déduit du jeton d'authentification), du plus récent au plus ancien."
      responses:
        "200":
          description: "Liste des favoris"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Favorite"
        "401":
          "$ref": "#/components/responses/Unauthorized"
    post:
      tags:
        - favorites
      summary: "Ajouter un utilisateur ou une activité aux favoris"
      description: "Le propriétaire (`userId`) est déduit du jeton d'authentification. Un couple (`userId`, `targetType`, `targetId`) est unique."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FavoriteCreate"
      responses:
        "201":
          description: "Favori créé"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Favorite"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/ProfileRequired"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/favorites/{targetId}":
    delete:
      tags:
        - favorites
      summary: "Retirer une cible des favoris"
      description: "Supprime le(s) favori(s) de l'utilisateur authentifié pointant vers `targetId`."
      parameters:
        - name: targetId
          in: path
          required: true
          description: "Identifiant de l'utilisateur ou de l'activité mis en favori"
          schema:
            type: string
      responses:
        "204":
          description: "Favori supprimé"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Jeton d'identité Firebase Authentication"
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: "Identifiant de l'utilisateur (uid Firebase Auth)"
      schema:
        type: string
  responses:
    BadRequest:
      description: "Requête invalide"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unauthorized:
      description: "Jeton d'authentification manquant ou invalide"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: "L'utilisateur authentifié n'a pas le droit d'effectuer cette action"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ProfileRequired:
      description: "L'utilisateur du jeton n'a pas encore de profil dans `users` (à créer via PUT /users/{id}) ; vérifié avant toute autre validation"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error: "Complète ton profil pour continuer"
            code: profile_required
    NotFound:
      description: "Ressource introuvable"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Conflict:
      description: "La ressource existe déjà"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: "Message d'erreur lisible"
        code:
          type: string
          description: "Code d'erreur machine"
    Sport:
      type: string
      enum:
        - musculation
        - course_a_pied
        - football
        - basketball
        - natation
        - cyclisme
        - yoga
        - boxe
        - crossfit
        - tennis
        - autre
    Level:
      type: string
      enum:
        - debutant
        - intermediaire
        - avance
        - expert
    DayOfWeek:
      type: string
      enum:
        - lundi
        - mardi
        - mercredi
        - jeudi
        - vendredi
        - samedi
        - dimanche
    ActivityStatus:
      type: string
      enum:
        - en_attente
        - acceptee
        - refusee
        - terminee
    MediaType:
      type: string
      enum:
        - image
        - video
    GeoPoint:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          example: 45.764
        lng:
          type: number
          format: double
          example: 4.8357
        city:
          type: string
          example: Lyon
    SportPractice:
      type: object
      required:
        - sport
        - level
      properties:
        sport:
          "$ref": "#/components/schemas/Sport"
        level:
          "$ref": "#/components/schemas/Level"
    AvailabilitySlot:
      type: object
      required:
        - dayOfWeek
        - startTime
        - endTime
      properties:
        dayOfWeek:
          "$ref": "#/components/schemas/DayOfWeek"
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "18:00"
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "20:00"
    User:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - location
        - sports
        - availability
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          nullable: true
        location:
          "$ref": "#/components/schemas/GeoPoint"
        sports:
          type: array
          items:
            "$ref": "#/components/schemas/SportPractice"
        availability:
          type: array
          items:
            "$ref": "#/components/schemas/AvailabilitySlot"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserSearchResult:
      description: "Résultat de GET /users : un User enrichi de distanceKm quand la recherche est géolocalisée."
      allOf:
        - "$ref": "#/components/schemas/User"
        - type: object
          properties:
            distanceKm:
              type: number
              format: double
              description: "Distance à vol d'oiseau depuis (lat, lng), arrondie à 1 décimale. Présent uniquement si lat et lng ont été fournis."
              example: 3.4
    UserUpdate:
      type: object
      description: "Champs du profil envoyés à PUT /users/{id}. En mise à jour, tous les champs sont optionnels. En création (profil inexistant), `firstName`, `lastName` et `location` sont obligatoires. `email`, `id`, `createdAt` et `updatedAt` ne sont pas acceptés : ils sont fixés par le serveur."
      properties:
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          nullable: true
        location:
          "$ref": "#/components/schemas/GeoPoint"
        sports:
          type: array
          items:
            "$ref": "#/components/schemas/SportPractice"
        availability:
          type: array
          items:
            "$ref": "#/components/schemas/AvailabilitySlot"
    Lieu:
      type: object
      required:
        - nom
        - lat
        - lng
      properties:
        nom:
          type: string
          example: "Parc de la Tête d'Or"
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
    Media:
      type: object
      required:
        - url
        - type
      properties:
        url:
          type: string
          format: uri
        type:
          "$ref": "#/components/schemas/MediaType"
    Activity:
      type: object
      description: "Proposition ponctuelle d'un utilisateur (createdBy) à un autre (guestId) — pas une annonce ouverte avec quota de places."
      required:
        - id
        - createdBy
        - guestId
        - sport
        - startAt
        - lieu
        - message
        - status
        - createdAt
      properties:
        id:
          type: string
        createdBy:
          type: string
          description: "uid de l'utilisateur à l'origine de la proposition"
        guestId:
          type: string
          description: "uid de l'utilisateur invité, toujours différent de createdBy"
        sport:
          "$ref": "#/components/schemas/Sport"
        startAt:
          type: string
          format: date-time
        lieu:
          "$ref": "#/components/schemas/Lieu"
        message:
          type: string
        status:
          "$ref": "#/components/schemas/ActivityStatus"
        conversationId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        media:
          allOf:
            - "$ref": "#/components/schemas/Media"
          nullable: true
    ActivityCreate:
      type: object
      required:
        - guestId
        - sport
        - startAt
        - lieu
        - message
      properties:
        guestId:
          type: string
          description: "uid de l'utilisateur invité, doit différer de l'utilisateur authentifié"
        sport:
          "$ref": "#/components/schemas/Sport"
        startAt:
          type: string
          format: date-time
        lieu:
          "$ref": "#/components/schemas/Lieu"
        message:
          type: string
          minLength: 1
          maxLength: 500
        media:
          allOf:
            - "$ref": "#/components/schemas/Media"
          nullable: true
    ActivityStatusUpdate:
